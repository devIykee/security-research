[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ffi = false
# Never auto-broadcast; tests are fork-only.

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com/"
local = "http://127.0.0.1:8545"
