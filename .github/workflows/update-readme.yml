name: Update README Audit Progress

on:
  push:
    branches: [main]
    paths:
      - 'hunts/**'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update audit progress in README
        run: |
          # Count total hunt directories (excluding utility dirs)
          TOTAL=$(find hunts/ -maxdepth 1 -type d | grep -v "^hunts/$" | grep -v "_meta\|_triage\|_master\|_verified" | wc -l)

          # Count complete hunts (have FINAL or COMPLETE reports)
          COMPLETE=$(find hunts/*/  -maxdepth 1 \( -name "*FINAL*REPORT*.md" -o -name "*COMPLETE*.md" -o -name "FINDINGS-MASTER.md" \) 2>/dev/null | wc -l)

          # Generate progress bar with emojis (one green box per completed audit)
          PROGRESS_BAR=$(printf '🟩%.0s' $(seq 1 $COMPLETE))

          # Update the audit progress section in README
          # Find the line with "### X+ Audits Complete" and replace it
          sed -i "s/### [0-9]\++* Audits Complete/### ${COMPLETE}+ Audits Complete/" README.md

          # Update the progress bar
          sed -i "/^🟩🟩/c\\${PROGRESS_BAR}" README.md

          # Update the badge count
          sed -i "s/Audits-[0-9]\++-/Audits-${COMPLETE}+-/" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update audit progress to ${COMPLETE}+ audits [skip ci]"
          git push
