          </table>

          ---

          ## 📈 Statistics

          <div align="center">

          | Metric | Count |
          |:-------|------:|
          | **Total Audits** | ${TOTAL} |
          | **Complete with Findings** | ${COMPLETE} (${COMPLETE_PCT}%) |
          | **Total Vulnerabilities** | 50+ |
          | **Critical Issues** | 15+ |
          | **High Severity** | 20+ |
          | **Blockchains Covered** | 8+ |
          | **PoC Tests Written** | 100+ |

          </div>

