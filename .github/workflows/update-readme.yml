name: Update README Audit Progress

on:
  push:
    branches: [main]
    paths:
      - 'hunts/**'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update audit progress in README
        run: |
          # Count total hunt directories (excluding utility dirs)
          TOTAL=$(find hunts/ -maxdepth 1 -type d | grep -v "^hunts/$" | grep -v "_meta\|_triage\|_master\|_verified" | wc -l)

          # Count complete hunts (have FINAL or COMPLETE reports)
          COMPLETE=$(find hunts/*/  -maxdepth 1 \( -name "*FINAL*REPORT*.md" -o -name "*COMPLETE*.md" -o -name "FINDINGS-MASTER.md" \) 2>/dev/null | wc -l)

          # Generate progress bar in condensed grid format
          # Always use 25 boxes per line for consistent grid
          BOXES_PER_LINE=25

          # Calculate full lines and remaining boxes
          FULL_LINES=$((COMPLETE / BOXES_PER_LINE))
          REMAINING=$((COMPLETE % BOXES_PER_LINE))

          PROGRESS_BAR=""

          # Add full lines
          for (( i=0; i<FULL_LINES; i++ )); do
            PROGRESS_BAR="${PROGRESS_BAR}$(printf '🟩%.0s' $(seq 1 $BOXES_PER_LINE))"
            PROGRESS_BAR="${PROGRESS_BAR}  "  # Line break (two spaces)
          done

          # Add remaining boxes on final line
          if [ $REMAINING -gt 0 ]; then
            PROGRESS_BAR="${PROGRESS_BAR}$(printf '🟩%.0s' $(seq 1 $REMAINING))"
          fi

          # Update README.md
          # Create temporary file with updated content
          awk -v complete="$COMPLETE" -v progress="$PROGRESS_BAR" '
          BEGIN { in_progress = 0 }

          /^### [0-9]+\+ Audits Complete/ {
            print "### " complete "+ Audits Complete"
            next
          }

          /^<div style="overflow-x: hidden;">/ {
            print $0
            print ""
            print progress
            print ""
            in_progress = 1
            next
          }

          in_progress && /^<\/div>/ {
            print $0
            in_progress = 0
            next
          }

          in_progress { next }

          /Audits-[0-9]+\+-/ {
            gsub(/Audits-[0-9]+\+-/, "Audits-" complete "+-")
          }

          { print }
          ' README.md > README.md.tmp && mv README.md.tmp README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          COMPLETE=$(find hunts/*/  -maxdepth 1 \( -name "*FINAL*REPORT*.md" -o -name "*COMPLETE*.md" -o -name "FINDINGS-MASTER.md" \) 2>/dev/null | wc -l)
          git diff --staged --quiet || git commit -m "chore: auto-update audit progress to ${COMPLETE}+ audits [skip ci]"
          git push
