name: Update README Audit Progress

on:
  push:
    branches: [main]
    paths:
      - 'hunts/**'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update audit progress in README
        run: |
          # Count complete hunts (have FINAL or COMPLETE reports)
          COMPLETE=$(find hunts/*/  -maxdepth 1 \( -name "*FINAL*REPORT*.md" -o -name "*COMPLETE*.md" -o -name "FINDINGS-MASTER.md" \) 2>/dev/null | wc -l)

          # Update only the count, NOT the visual boxes
          # The boxes stay fixed at 44, only the number increases
          sed -i "s/### [0-9]\++* Audits Complete/### ${COMPLETE}+ Audits Complete/" README.md

          # Update the badge count
          sed -i "s/Audits-[0-9]\++-/Audits-${COMPLETE}+-/" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          COMPLETE=$(find hunts/*/  -maxdepth 1 \( -name "*FINAL*REPORT*.md" -o -name "*COMPLETE*.md" -o -name "FINDINGS-MASTER.md" \) 2>/dev/null | wc -l)
          git diff --staged --quiet || git commit -m "chore: auto-update audit count to ${COMPLETE}+ [skip ci]"
          git push
